{% extends "_base.html" %}

{% block title %}Welcome!{% endblock %}

{% block header %}
    <div class="flex justify-end">
        <a href="{{ url_for('greeter') }}" class="flex p-4 border-2 border-white text-white rounded-lg text-xl hover:bg-orange-600 hover:text-gray-50 hover:border-orange-600 font-semibold">
            Exit Admin Panel
        </a>
    </div>
{% endblock %}

{% block content %}
    <!-- title -->
    <div class="text-gray-700 text-4xl font-semibold">
        Admin Panel
    </div>
    <div class="grid grid-cols-2 gap-5">
        <!-- daily stats -->
        <a href="{{ url_for('visitor_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            View data
        </a>
        <!-- edit current data -->
        <a href="{{ url_for('volunteer_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            Edit data
        </a>
        <!-- add regular volunteer -->
        <a href="{{ url_for('visitor_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            Add volunteer
        </a>
        <!-- backup data -->
        <a href="{{ url_for('volunteer_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            View historic data
        </a>
    </div>
{% endblock %}

{% block footer %}
{% endblock %}
