{% extends "_base.html" %}

{% block title %}Welcome!{% endblock %}

{% block content %}
    <!-- add a large bolded title -->
    <div class="text-gray-700 text-4xl font-semibold">
        Welcome to the Erie Bike Co-op!
    </div>
    <!-- alert -->
    {% include "_alert.html" %}
    <!-- visitor -->
    <a href="{{ url_for('visitor') }}" class="block w-full text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
        Visitor
    </a>
    <!-- volunteer -->
    <a href="{{ url_for('volunteer') }}" class="block w-full text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
        Volunteer
    </a>

    <!-- drop alert script -->
    {% include "_drop_alert.html" %}
{% endblock %}

{% block footer %}
    Oct 20, 2026 - 18 visitors - 7 volunteers
{% endblock %}
