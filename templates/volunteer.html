{% extends "_base.html" %}

{% block title %}Volunteer Options{% endblock %}

{% block content %}
    <main class="w-4xl flex flex-col bg-gray-50 rounded-xl p-5 gap-5 border-2 border-gray-100">
        <!-- title -->
        <div class="text-gray-700 text-4xl font-semibold">
            Volunteer Options
        </div>
        <!-- validation error -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div id="alert" class="w-full p-5 text-2xl rounded-lg text-yellow-600 border-2 border-yellow-600 bg-yellow-200">
            {{ messages[-1] }}
        </div>
        {% endif %}
        {% endwith %}
        <div class="flex flex-col gap-5">
            <div class="columns-2 gap-5">
                <!-- sign in -->
                <a href="{{ url_for('volunteer_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
                    Sign in
                </a>
                <!-- sign out -->
                <a href="{{ url_for('volunteer_sign_out') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
                    Sign out
                </a>
            </div>
            <!-- back to main -->
            <a href="{{ url_for('greeter') }}" class="w-full font-semibold self-start rounded-lg text-orange-600 text-center p-3 border-2 border-orange-600 text-xl hover:bg-gray-200">
                Back
            </a>
        </div>
    </main>
{% endblock %}
