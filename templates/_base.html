<!DOCTYPE html>
<html lang="en">
<head>
    <!-- metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="sunlime">
    <!-- css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">     -->
    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='favicon/favicon-96x96.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <!-- title -->
    <title>{% block title %}Erie Bike Co-op{% endblock %}</title>
</head>
<body class="bg-orange-300 bg-repeat" style="background-image: url('{{ url_for('static', filename='pattern/cogs.svg') }}');">
    <!-- header block -->
    <header class="fixed top-0 w-full p-3">
        {% block header %}

        {% endblock %}
    </header>
    <div class="min-h-dvh flex items-center justify-center p-10">
        <div class="p-2 bg-white rounded-2xl shadow-xl">
            <!-- primary content block-->
            <main class="{% block width %}w-4xl{% endblock %} flex {% block flex %}flex-col{% endblock %} bg-gray-50 rounded-xl p-5 gap-5 border-2 border-gray-100">
                {% block content %}

                {% endblock %}
            </main>
        </div>
    </div>
    <!-- footer block -->
    <footer class="fixed bottom-0 w-full p-3">
        {% block footer %}

        {% endblock %}
    </footer>
    {% block script %}

    {% endblock %}
</body>
</html>
