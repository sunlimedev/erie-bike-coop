{% extends "_base.html" %}

{% block title %}Greeter{% endblock %}

{% block content %}
    <!-- create a large, white, rounded container with some padding around and space between children-->
    <div class="w-xl bg-white rounded-xl p-3 space-y-3">
        <!-- add a large bolded title -->
        <div class="text-2xl font-bold">
            Welcome to the Erie Bike Co-op!
        </div>
        <!-- alert -->
        {% include "_alert.html" %}
        <!-- link to sign in -->
        <a href="{{ url_for('sign_in') }}" class="block w-full text-white text-lg font-bold rounded-lg p-3 bg-orange-600 text-center">
            Sign in
        </a>
        <!-- link to sign out -->
        <a href="{{ url_for('sign_out') }}" class="block w-full text-white text-lg font-bold rounded-lg p-3 bg-orange-600 text-center">
            Sign out
        </a>
    </div>
    <!-- drop alert script -->
    {% include "_drop_alert.html" %}
{% endblock %}
