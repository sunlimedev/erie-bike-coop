{% extends "_base.html" %}

{% block title %}Welcome!{% endblock %}

{% block header %}

        <a href="{{ url_for('admin') }}" class="flex p-4 border-2 border-white text-white rounded-lg text-xl hover:bg-orange-600 hover:text-gray-50 hover:border-orange-600 font-semibold">
            Admin
        </a>
    </div>
{% endblock %}

{% block content %}
    <!-- title -->
    <div class="text-gray-700 text-4xl font-semibold">
        Welcome to the Erie Bike Co-op!
    </div>
    <div class="columns-2 gap-5">
        <!-- visitor -->
        <a href="{{ url_for('visitor_form') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            Visitor
        </a>
        <!-- volunteer -->
        <a href="{{ url_for('volunteer') }}" class="block text-gray-50 text-4xl font-semibold rounded-lg p-8 bg-orange-600 text-center hover:bg-orange-700">
            Volunteer
        </a>

{% endblock %}

{% block footer %}
{% endblock %}
